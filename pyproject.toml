[project]
name = "wet-dry-vac-to-dreame-l50-ultra-adapter"
version = "0.1.0"
description = "Parametric CAD experiments for a Dreame L50 Ultra wet/dry vac adapter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "build123d==0.11.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "matplotlib>=3.9,<4",
]
reference = [
    "trimesh>=4,<5",
    "shapely>=2,<3",
    "networkx>=3,<4",
]
